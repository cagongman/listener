[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listener-hermes"
version = "0.1.0"
description = "Korean wake-word launcher for Hermes CLI"
requires-python = ">=3.11"
dependencies = ["listener-speech>=0.2.0", "websockets>=15,<18"]

[project.scripts]
listener-hermes = "listener_hermes.app:main"

[tool.setuptools]
packages = ["listener_hermes"]
